
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Cloud Showcase | V2</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f8fafc;
    }

    nav {
      padding: 22px 8%;
      background: #172554;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 70px auto;
      padding: 20px;
      text-align: center;
    }

    .tag {
      display: inline-block;
      padding: 9px 15px;
      border-radius: 20px;
      background: #164e63;
      color: #a5f3fc;
      font-size: 13px;
      font-weight: bold;
    }

    h1 { font-size: 48px; }

    p {
      color: #cbd5e1;
      line-height: 1.8;
      font-size: 17px;
    }

    .card {
      max-width: 560px;
      margin: 35px auto;
      padding: 28px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
    }

    .status {
      color: #86efac;
      font-weight: bold;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <nav>☁ DevOps Cloud Showcase</nav>

  <main>
    <span class="tag">DEVOPS CAPSTONE PROJECT · V2</span>
    <h1>Deploy with Confidence.</h1>

    <p>
      An updated web application demonstrating
      version-controlled container deployment.
    </p>

    <section class="card">
      <h2>Application Status</h2>
      <p class="status">● Version 2 is running</p>
      <p>Updated design packaged in a new Docker image.</p>
    </section>
  </main>

  <footer>Cloud & DevOps Bootcamp · Updated Capstone</footer>
</body>
</html>
