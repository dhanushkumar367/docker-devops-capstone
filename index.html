
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Cloud Showcase</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172b4d;
    }

    nav {
      background: #102a43;
      color: white;
      padding: 22px 8%;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 70px auto;
      padding: 20px;
      text-align: center;
    }

    .tag {
      display: inline-block;
      padding: 9px 15px;
      border-radius: 20px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: bold;
    }

    h1 { font-size: 48px; }

    p {
      color: #52647a;
      line-height: 1.8;
      font-size: 17px;
    }

    .card {
      max-width: 560px;
      margin: 35px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px #00000010;
    }

    .status {
      color: #15803d;
      font-weight: bold;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #718096;
    }
  </style>
</head>
<body>
  <nav>☁ DevOps Cloud Showcase</nav>

  <main>
    <span class="tag">DEVOPS CAPSTONE PROJECT</span>
    <h1>Build. Package. Deploy.</h1>

    <p>
      A web application demonstrating Git, GitHub,
      Docker and container deployment.
    </p>

    <section class="card">
      <h2>Application Status</h2>
      <p class="status">● Version 1 is running</p>
      <p>Served by NGINX inside a Docker container.</p>
    </section>
  </main>

  <footer>Cloud & DevOps Bootcamp · Capstone 2</footer>
</body>
</html>
